<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flip 7 Vengeance – Scores</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Bebas+Neue&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3eefb; --surface:#ffffff; --ink:#1d1533; --muted:#6c6285; --line:#ddd3ee;
  --accent:#6b2fd6; --accent-ink:#ffffff; --num:#efe8fb; --num-on:#6b2fd6;
  --neg:#fde3ea; --neg-ink:#a3123a; --neg-on:#d0204f; --half:#dff3ee; --half-ink:#0b6b57; --half-on:#0f9b7d;
  --good:#0f9b7d;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140f24; --surface:#1f1836; --ink:#f1ebff; --muted:#a79bc4; --line:#3a2f5c;
    --accent:#9a6bff; --accent-ink:#140f24; --num:#2c2350; --num-on:#9a6bff;
    --neg:#3b1a2b; --neg-ink:#ff9db7; --neg-on:#ff4f7e; --half:#14332f; --half-ink:#7be3cc; --half-on:#2fd1ae;
    --good:#2fd1ae; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#140f24; --surface:#1f1836; --ink:#f1ebff; --muted:#a79bc4; --line:#3a2f5c;
  --accent:#9a6bff; --accent-ink:#140f24; --num:#2c2350; --num-on:#9a6bff;
  --neg:#3b1a2b; --neg-ink:#ff9db7; --neg-on:#ff4f7e; --half:#14332f; --half-ink:#7be3cc; --half-on:#2fd1ae;
  --good:#2fd1ae; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;font-weight:500;line-height:1.35;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:16px 12px 40px}
h1{font-size:26px;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:18px;font-weight:700;margin:0}
p.sub{color:var(--muted);margin:0 0 16px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.stepper{display:flex;align-items:center;gap:14px;margin:8px 0 14px}
.stepper button{width:52px;height:52px;border-radius:14px;background:var(--num);font-size:26px;font-weight:700}
.stepper output{font-size:34px;font-weight:800;min-width:40px;text-align:center}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;font:inherit;font-size:18px}
.primary{width:100%;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:700}
.ghost{height:44px;padding:0 14px;border-radius:12px;background:transparent;border:1px solid var(--line);color:var(--ink)}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.topbar .round{font-size:22px;font-weight:800}

.phead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.pname{font-size:20px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptotal{font-size:13px;color:var(--muted)}
.pscore{font-size:40px;font-weight:800;line-height:1;text-align:right;min-width:64px;font-variant-numeric:tabular-nums}
.pscore.neg{color:var(--neg-ink)}
.grid{display:grid;gap:6px;margin-bottom:6px}
.grid.nums{grid-template-columns:repeat(7,1fr)}
.grid.spec{grid-template-columns:repeat(5,1fr)}
.chip{height:46px;border-radius:12px;font-size:18px;font-weight:700;background:var(--num);color:var(--ink);transition:transform .08s}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--num-on);color:var(--accent-ink)}
.chip.neg{background:var(--neg);color:var(--neg-ink)}
.chip.neg.on{background:var(--neg-on);color:#fff}
.chip.half{background:var(--half);color:var(--half-ink)}
.chip.half.on{background:var(--half-on);color:#fff}
.grid.spec .chip{height:50px}

.sticky{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}

table{width:100%;border-collapse:collapse}
th,td{padding:10px 6px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;color:var(--muted);font-weight:500}
td.total{font-weight:800;font-size:20px}
tr.lead td.total{color:var(--good)}
td.rs{color:var(--muted)}
.scroll{overflow-x:auto}
.row-actions{display:flex;gap:8px;margin-top:10px}
.row-actions .ghost{flex:1}

/* Style cartes : une couleur par numéro, bord crème, chiffres ronds et épais */
:root{--card:#fffaf0;--disp:"Lilita One","Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif}
h1,.round,.pname,.pscore,.primary{font-family:var(--disp);font-weight:400;letter-spacing:.01em}
h1{font-size:32px}
.pscore{font-size:46px}
.grid.nums .chip,.grid.spec .chip{font-family:var(--disp);font-weight:400;font-size:22px;background:var(--card);color:var(--c);border:3px solid var(--c);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.grid.nums .chip.on,.grid.spec .chip.on{background:var(--c);color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3);box-shadow:inset 0 0 0 2px var(--card),0 3px 0 rgba(0,0,0,.28)}
.chip:active{transform:translateY(2px);box-shadow:none}
.chip[data-n="1"]{--c:#6b7685}
.chip[data-n="2"]{--c:#e0457b}
.chip[data-n="3"]{--c:#e8590c}
.chip[data-n="4"]{--c:#c78a00}
.chip[data-n="5"]{--c:#4f9a00}
.chip[data-n="6"]{--c:#0a9d6b}
.chip[data-n="7"]{--c:#0891b2}
.chip[data-n="8"]{--c:#2563eb}
.chip[data-n="9"]{--c:#6d3fe0}
.chip[data-n="10"]{--c:#b81fc9}
.chip[data-n="11"]{--c:#dc2626}
.chip[data-n="12"]{--c:#0f766e}
.chip[data-n="13"]{--c:#1f2937}
.chip.neg{--c:#d0204f}
.chip.half{--c:#6d3fe0}
.panel{border-width:2px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.primary{font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.primary:active{transform:translateY(2px);box-shadow:none}

/* Style déduit des cartes réelles : fond crème, bord indigo, filet doré, chiffres condensés cernés */
:root:root:root{--bg:#fff7dc;--surface:#f8ecc4;--ink:#2b2680;--muted:#6a6290;--line:#2e2a8c;--accent:#2e2a8c;--accent-ink:#fff7dc;--disp:"Bebas Neue","Oswald","Arial Narrow","Trebuchet MS",sans-serif;color-scheme:light}
body{background:#fff7dc}
h1{font-size:42px}
.round{font-size:28px}
.pname{font-size:26px}
.pscore{font-size:60px}
.primary{font-size:28px;letter-spacing:.05em}
.panel{background:#f8ecc4;border:3px solid #2e2a8c;box-shadow:inset 0 0 0 3px #f4d35e,0 4px 0 rgba(46,42,140,.35)}
.grid.nums .chip,.grid.spec .chip{background:#f6ecc8;color:var(--c);border:3px solid #2e2a8c;font-size:30px;line-height:1;letter-spacing:.02em;-webkit-text-stroke:1.5px #2e2a8c;paint-order:stroke fill;text-shadow:none;box-shadow:inset 0 0 0 2px #f4d35e,0 3px 0 rgba(46,42,140,.4)}
.grid.nums .chip.on,.grid.spec .chip.on{background:var(--c);color:#fff7dc;text-shadow:none;box-shadow:inset 0 0 0 2px #f4d35e,0 3px 0 rgba(46,42,140,.4)}
.chip[data-n="1"]{--c:#b3a28f}
.chip[data-n="2"]{--c:#f2b72c}
.chip[data-n="3"]{--c:#ef5a6b}
.chip[data-n="4"]{--c:#4fb8b8}
.chip[data-n="5"]{--c:#4a86d8}
.chip[data-n="6"]{--c:#a64ca6}
.chip[data-n="7"]{--c:#e9739a}
.chip[data-n="8"]{--c:#9ccc65}
.chip[data-n="9"]{--c:#f7941d}
.chip[data-n="10"]{--c:#e8212b}
.chip[data-n="11"]{--c:#7aa3c9}
.chip[data-n="12"]{--c:#8c7f78}
.chip[data-n="13"]{--c:#4b4590}
.chip.neg{--c:#e8212b}
.chip.half{--c:#a64ca6}

/* Cartes portrait comme dans le jeu, couleurs relevées sur la photo */
.grid{gap:12px 6px}
.grid.spec{grid-template-columns:repeat(6,1fr)}
.grid.nums .chip{height:66px;font-size:36px;border-radius:9px}
.grid.spec .chip{height:74px;font-size:30px;border-radius:9px}
.grid .chip{position:relative;padding:0}
.grid .chip::before,.grid .chip::after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:16px;height:7px;background:var(--c);border:2px solid #2e2a8c;pointer-events:none}
.grid .chip::before{top:-7px;border-radius:8px 8px 0 0;border-bottom:0}
.grid .chip::after{bottom:-7px;border-radius:0 0 8px 8px;border-top:0}
.chip[data-n="1"]{--c:#b0a090}
.chip[data-n="2"]{--c:#d8de12}
.chip[data-n="3"]{--c:#e8426b}
.chip[data-n="4"]{--c:#3fb6bd}
.chip[data-n="5"]{--c:#2f9e3f}
.chip[data-n="6"]{--c:#a64ca6}
.chip[data-n="7"]{--c:#e07a7a}
.chip[data-n="8"]{--c:#a3cc6a}
.chip[data-n="9"]{--c:#f7941d}
.chip[data-n="10"]{--c:#e30613}
.chip[data-n="11"]{--c:#6f93d9}
.chip[data-n="12"]{--c:#9c8b7e}
.chip[data-n="13"]{--c:#1779d1}
.chip.neg,.chip.half{--c:#ec4f3f}

/* Police plus grande */
body{font-size:18px}
.grid.nums .chip{height:72px;font-size:48px}
.grid.spec .chip{height:80px;font-size:36px}
.pname{font-size:32px}
.ptotal{font-size:17px}
.pscore{font-size:72px}
.round{font-size:32px}
h1{font-size:48px}
.primary{font-size:32px;height:64px}
.ghost{font-size:18px;height:48px}
.field span{font-size:17px}
.field input{font-size:22px;height:56px}
.stepper output{font-size:44px}
th{font-size:16px}
th,td{font-size:19px}
td.total{font-size:26px}
.grid.spec .chip{font-size:42px;letter-spacing:-.04em;white-space:nowrap;-webkit-text-stroke:1px #2e2a8c}

/* Liserets dorés : double filet à l’intérieur de chaque carte */
.grid.nums .chip,.grid.spec .chip{box-shadow:inset 0 0 0 3px #f6c93a,inset 0 0 0 5px #f6ecc8,inset 0 0 0 6px #f6c93a,0 3px 0 rgba(46,42,140,.4)}
.grid.nums .chip.on,.grid.spec .chip.on{box-shadow:inset 0 0 0 3px #f6c93a,inset 0 0 0 5px var(--c),inset 0 0 0 6px #f6c93a,0 3px 0 rgba(46,42,140,.4)}
.panel{box-shadow:inset 0 0 0 3px #f6c93a,inset 0 0 0 5px #f8ecc4,inset 0 0 0 6px #f6c93a,0 4px 0 rgba(46,42,140,.35)}

/* Score de la manche présenté comme une carte */
.pscore{--c:#3fb6bd;position:relative;background:#f6ecc8;color:var(--c);border:3px solid #2e2a8c;border-radius:10px;padding:10px 16px 4px;min-width:92px;text-align:center;font-size:60px;-webkit-text-stroke:2px #2e2a8c;paint-order:stroke fill;box-shadow:inset 0 0 0 3px #f6c93a,inset 0 0 0 5px #f6ecc8,inset 0 0 0 6px #f6c93a,0 3px 0 rgba(46,42,140,.4)}
.pscore.neg{--c:#ec4f3f;color:var(--c)}
.pscore::before,.pscore::after{content:"";position:absolute;left:50%;transform:translateX(-50%);width:18px;height:8px;background:var(--c);border:2px solid #2e2a8c;pointer-events:none}
.pscore::before{top:-8px;border-radius:9px 9px 0 0;border-bottom:0}
.pscore::after{bottom:-8px;border-radius:0 0 9px 9px;border-top:0}

/* Cartes malus : fond rouge comme dans le jeu, chiffre blanc cerné */
.grid.spec .chip{background:#f3a69b;color:#fff;-webkit-text-stroke:1.5px #2e2a8c;box-shadow:inset 0 0 0 3px #f6c93a,inset 0 0 0 5px #f3a69b,inset 0 0 0 6px #f6c93a,0 3px 0 rgba(46,42,140,.4)}
.grid.spec .chip.on{background:#e8402f;color:#fff;box-shadow:inset 0 0 0 3px #f6c93a,inset 0 0 0 5px #e8402f,inset 0 0 0 6px #f6c93a,0 3px 0 rgba(46,42,140,.4)}

/* Fond rouge des malus relevé sur la photo : corail avec halo plus clair au centre */
.grid.spec .chip,.grid.spec .chip.on{background:radial-gradient(circle at 50% 50%,#f6877b 0%,#ed5b4b 72%);box-shadow:inset 0 0 0 3px #f6c93a,inset 0 0 0 5px #ed5b4b,inset 0 0 0 6px #f6c93a,0 3px 0 rgba(46,42,140,.4)}
.grid.spec .chip.on{color:#ffe14d;outline:3px solid #2e2a8c;outline-offset:2px;transform:translateY(-2px)}

/* Cartes SVG : reproduction du modèle */
.card{padding:0;border:0;background:none;display:block;width:100%;aspect-ratio:2/3;position:relative;opacity:.8;filter:drop-shadow(0 2px 0 rgba(47,42,134,.35));transition:transform .08s,opacity .08s}
.card svg{display:block;width:100%;height:100%;overflow:visible}
.card:active{transform:scale(.94)}
.card.on{opacity:1;transform:translateY(-3px);outline:3px solid #2f2a86;outline-offset:2px;border-radius:10px}
.card.on::after{content:"\2713";position:absolute;right:-6px;top:-8px;width:20px;height:20px;border-radius:50%;background:#1b9e4b;color:#fff;font:700 13px/20px sans-serif;text-align:center;box-shadow:0 0 0 2px #fff7dc}

/* Page des joueurs : même style que les cartes */
.stepper{gap:12px}
.stepper button{width:62px;height:62px;border-radius:10px;background:#f6ecc8;border:3px solid #2f2a86;color:#ed5b4b;font-family:var(--disp);font-weight:400;font-size:46px;line-height:1;padding:0;-webkit-text-stroke:1.5px #2f2a86;paint-order:stroke fill;box-shadow:inset 0 0 0 3px #f5cf3a,inset 0 0 0 5px #f6ecc8,inset 0 0 0 6px #f5cf3a,0 3px 0 rgba(47,42,134,.4)}
.stepper button[data-a="plus"]{color:#2f9c3d}
.stepper button:active{transform:translateY(2px);box-shadow:inset 0 0 0 3px #f5cf3a,inset 0 0 0 5px #f6ecc8,inset 0 0 0 6px #f5cf3a}
.stepper output{display:flex;align-items:center;justify-content:center;width:70px;height:92px;border-radius:10px;background:#f6ecc8;border:3px solid #2f2a86;color:#3fb6bd;font-family:var(--disp);font-size:68px;line-height:1;min-width:0;padding-top:4px;-webkit-text-stroke:2px #2f2a86;paint-order:stroke fill;box-shadow:inset 0 0 0 3px #f5cf3a,inset 0 0 0 5px #f6ecc8,inset 0 0 0 6px #f5cf3a,0 3px 0 rgba(47,42,134,.4)}
.stepper span{font-family:var(--disp);font-size:26px;letter-spacing:.04em;color:var(--ink)!important}
.field span{font-family:var(--disp);font-size:22px;letter-spacing:.04em;color:var(--ink)}
.field input{background:#fffbea;border:3px solid #2f2a86;border-radius:10px;box-shadow:inset 0 0 0 2px #f5cf3a}
.stepper button,.stepper output{background:radial-gradient(circle at 50% 40%,#fffdf2 0,#f3e6b8 100%);box-shadow:inset 0 0 0 3px #f5cf3a,inset 0 0 0 5px #f6e9bf,inset 0 0 0 6px #f5cf3a,0 3px 0 rgba(47,42,134,.4)}
.stepper button:active{background:radial-gradient(circle at 50% 40%,#fffdf2 0,#f3e6b8 100%)}

/* Sélecteur de langue */
.langbar{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}
.lang{font-family:var(--disp);font-size:18px;letter-spacing:.04em;height:34px;min-width:44px;padding:0 8px;border:2px solid #2f2a86;border-radius:8px;background:#fffbea;color:#2f2a86}
.lang.on{background:#2f2a86;color:#fff7dc}
.f7plus{color:#fff7dc;margin-left:4px}
.primary{white-space:nowrap;overflow:hidden;padding:0 12px}
.sticky .primary{font-size:24px;height:54px}
.phist{gap:6px}
.hc{width:42px}
.hv,.hin{font-size:26px}
html.snap{scroll-snap-type:none;scroll-padding-top:calc(var(--tbh,0px) + env(safe-area-inset-top,0px));scroll-padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
html.snap section.panel[data-p]{scroll-snap-align:start}
html.snap{scroll-behavior:auto}
@media (prefers-reduced-motion: reduce){html.snap{scroll-behavior:auto}}
html.snap .hint{scroll-snap-align:end}
.topbar > div:nth-child(2){flex:1 1 100%;display:flex;gap:6px;flex-wrap:nowrap;min-width:0}
.topbar .ghost{flex:1 1 0;min-width:0;padding:0 6px}
.topbar .ghost,.row-actions .ghost,.pedit .ghost,.addp .ghost{white-space:nowrap;overflow:hidden}
.hof{margin-top:12px}
.gline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid #d9c78a;font-family:var(--disp);font-size:20px;letter-spacing:.03em;color:#2f2a86}
.gline b{flex:1;min-width:0;font-weight:400;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname.isdealer{background:#ffe14d;border-radius:7px;padding:3px 8px 0;box-shadow:0 0 0 2px #2f2a86}
.tchip.isdealer{background:#ffe14d}
.pbtns{display:flex;gap:6px;justify-content:center}
.bustb{height:38px;padding:0 8px;border:2px solid #2f2a86;border-radius:8px;background:#fffbea;color:#e3101c;font-family:var(--disp);font-size:18px;letter-spacing:.04em}
.bustb.on{background:#e3101c;color:#fff}
.pscore.bust,.qin.bust{color:#e3101c;text-decoration:line-through}
.dealer{font-family:var(--disp);font-size:16px;letter-spacing:.04em;line-height:1;color:#fff7dc;background:#2f2a86;border-radius:6px;padding:4px 6px 2px}
.tfield{margin-top:8px}
.tchoices{display:flex;gap:6px;flex-wrap:wrap}
.tc{height:44px;min-width:56px;padding:0 8px;font-family:var(--disp);font-size:22px}
.tc.on{background:#2f2a86;color:#fff7dc}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:6px 0 14px;min-height:220px}
.pod{flex:1;max-width:120px;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.podn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--disp);font-size:22px;line-height:1.1;color:var(--pc);-webkit-text-stroke:1px #2f2a86;paint-order:stroke fill;opacity:0;animation:podIn .4s ease-out forwards}
.podt{margin-bottom:4px;font-family:var(--disp);font-size:20px;color:#2f2a86;opacity:0;animation:podIn .4s ease-out forwards}
.step{width:100%;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;border:3px solid #2f2a86;border-bottom:0;border-radius:10px 10px 0 0;background:radial-gradient(circle at 50% 30%,#fffdf2,#f1e2b2);box-shadow:inset 0 0 0 3px #f5cf3a;transform-origin:bottom;transform:scaleY(0);animation:podRise .6s cubic-bezier(.2,.9,.3,1.2) forwards}
.step span{font-family:var(--disp);font-size:44px;line-height:1;color:var(--pc);-webkit-text-stroke:1.5px #2f2a86;paint-order:stroke fill}
.pod1 .step{height:120px;animation-delay:.9s}
.pod1 .podn,.pod1 .podt{animation-delay:1.4s}
.pod1 .podn{font-size:26px}
.pod2 .step{height:84px;animation-delay:.5s}
.pod2 .podn,.pod2 .podt{animation-delay:1s}
.pod3 .step{height:58px;animation-delay:.1s}
.pod3 .podn,.pod3 .podt{animation-delay:.6s}
@keyframes podRise{to{transform:scaleY(1)}}
@keyframes podIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.winner .wt{display:inline-block;animation:trophy 1s ease-in-out 3}
@keyframes trophy{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.15) rotate(-6deg)}60%{transform:scale(1.1) rotate(5deg)}}
.winner .wn{animation:pop .6s cubic-bezier(.2,.9,.3,1.4) both}

      +frame()+ring(-1,'#e83e6a')+ring(151,'#f5cf3a')+fanSide('l','#e83e6a',72)
      +'<polygon points="6,113 11,109 11,126 6,122" fill="'+GOLD+'"/><polygon points="94,113 89,109 89,126 94,122" fill="'+GOLD+'"/>'
      +'<rect x="11" y="109" width="78" height="17" rx="2" fill="#fffbea" stroke="'+GOLD+'" stroke-width="1.5"/>'
      +txt(tr('zeroName'),50,122.5,11,Math.min(66,tr('zeroName').length*9),IND,'')
      +bigNum('0',50,100,94,38,'url(#'+sid+')',CREAM)
      +'</svg>';
  }

  function playerCard(i){
    var p = state.players[i], s = state.sel[i], t = totals()[i] + score(state.sel[i]), sc = score(s);
    if(state.out && state.out[i]){
      return '<section class="panel" data-p="'+i+'" style="--pc:'+pcol(i)+'"><div class="phead" style="margin:0;align-items:center"><div class="pname" style="opacity:.55">'+esc(p)+' – '+tr('notPlaying')+'</div><button type="button" class="ghost" data-p="'+i+'" data-o="1">'+tr('putBack')+'</button></div></section>';
    }
    var h = '<section class="panel" data-p="'+i+'" style="--pc:'+pcol(i)+'"><div class="phead"><div style="min-width:0">'
      + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><div class="pname'+(dealerIdx() === i ? ' isdealer' : '')+'">'+esc(p)+'</div><div class="ptotal" style="font-family:var(--disp);font-size:28px;line-height:1;letter-spacing:.04em;color:var(--ink)">'+tr('totalC',t)+'</div></div>'+histLine(i)+'</div>'
      + (isFlip7(s) ? '<div class="f7badge">Flip 7 <span class="f7plus">+15</span></div>' : '') + '<div class="pright">'+(isQuick(i) ? '<input class="qin'+(s.bust?' bust':'')+'" type="number" data-q="'+i+'" enterkeyhint="next" placeholder="0" aria-label="Score" value="'+(s.bust ? 0 : s.manual!=null ? s.manual : (score(s) || ''))+'">' : editIdx===i ? '<div class="pedit"><input type="number" inputmode="numeric" value="'+sc+'" aria-label="Score"><div style="display:flex;gap:4px"><button type="button" class="ghost" data-a="mok" data-i="'+i+'">OK</button><button type="button" class="ghost" data-a="mauto" data-i="'+i+'">Auto</button></div></div>' : '<div class="pscore'+(sc<0?' neg':'')+(s.manual!=null?' manual':'')+(s.bust?' bust':'')+'" data-score="'+i+'">'+sc+'</div>')+'<div class="pbtns"><button type="button" class="bustb'+(s.bust?' on':'')+'" data-p="'+i+'" data-b="1">'+tr('bust')+'</button>'+(state.quick ? '<button type="button" class="minib cardsb" data-p="'+i+'" data-c="1" aria-label="Mode">'+(isQuick(i) ? '🃏' : '⚡')+'</button>' : '<button type="button" class="minib" data-p="'+i+'" data-m="1" aria-label="Cartes">'+((state.mini && state.mini[i]) ? '▾' : '▴')+'</button>')+'</div></div></div>';
    h += '<div class="grid nums"'+((isQuick(i) || (state.mini && state.mini[i])) ? ' hidden' : '')+'>';
    h += '<button type="button" class="card'+(s.zero?' on':'')+'" data-p="'+i+'" data-z="1" aria-label="'+tr('card','0')+'">'+zeroCard()+'</button>';
    NUMS.forEach(function(n){
      h += '<button type="button" class="card'+(s.nums.indexOf(n)>=0?' on':'')+'" data-p="'+i+'" data-n="'+n+'" aria-label="'+tr('card',n)+'">'+numberCard(n)+'</button>';
    });
    h += '<button type="button" class="card'+(s.lucky?' on':'')+'" data-p="'+i+'" data-l="1" aria-label="'+tr('card','13 '+tr('lucky'))+'">'+luckyCard()+'</button>';
    NEGS.forEach(function(n){
      h += '<button type="button" class="card'+(s.negs.indexOf(n)>=0?' on':'')+'" data-p="'+i+'" data-g="'+n+'" aria-label="'+tr('card','−'+Math.abs(n))+'">'+malusCard(n)+'</button>';
    });
    h += '<button type="button" class="card'+(s.half?' on':'')+'" data-p="'+i+'" data-h="1" aria-label="'+tr('card','÷2')+'">'+malusCard('half')+'</button></div></section>';
    return h;
  }
  function renderRound(){
    var h = '<div class="topbar"><div class="round">'+tr('round',state.round)+'</div>'
      + '<div style="display:flex;gap:8px"><button type="button" class="ghost" data-a="scoreboard">'+tr('board')+'</button><button type="button" class="ghost" data-a="addp">'+tr('addPlayer')+'</button><button type="button" class="ghost'+(state.quick?' on':'')+'" data-a="quick">'+tr(state.quick?'cardsMode':'quickMode')+'</button>'
      + '<button type="button" class="ghost" data-a="abandon">'+tr('abandon')+'</button></div>'+chipsHtml()+'</div>';
    if(addMode) h += '<div class="panel addp"><input class="addname" type="text" autocomplete="off" placeholder="'+tr('playerN', state.players.length + 1)+'"><button type="button" class="ghost" data-a="addok">OK</button><button type="button" class="ghost" data-a="addcancel">×</button></div>';
    for(var i=0;i<state.players.length;i++) h += playerCard(i);
    h += '<p class="hint">ⓘ '+tr('hintRemove')+' '+tr('hintDealer')+'</p>';
    h += '<div class="sticky"><div class="srow"><button type="button" class="ghost allbust" data-a="allbust">\ud83d\udca5 '+tr('allBust')+'</button><button type="button" class="primary" data-a="validate">'+tr('validate')+'</button></div></div>';
    app.innerHTML = h;
  }
  function refreshCard(i){
    var card = app.querySelector('section[data-p="'+i+'"]');
    if(!card) return;
    var tmp = document.createElement('div');
    tmp.innerHTML = playerCard(i);
    card.replaceWith(tmp.firstChild);
    syncHist(); updateChips(); updateSnap();
  }

  /* ---------- Récap / tableau ---------- */
  function scoreboardHtml(){
    var tot = totals(), vis = tot.filter(function(v,i){ return !(state.out && state.out[i]); }), max = Math.max.apply(null, vis.length ? vis : tot);
    var h = '<div class="panel"><div class="scroll"><table><thead><tr><th>'+tr('player')+'</th>';
    state.history.forEach(function(r,k){ h += '<th>'+tr('rShort')+(k+1)+'</th>'; });
    h += '<th>'+tr('total')+'</th></tr></thead><tbody>';
    state.players.map(function(p,i){ return i; }).sort(function(a,b){ return tot[b]-tot[a]; }).forEach(function(i){
      var p = state.players[i];
      if(state.out && state.out[i]) return;
      h += '<tr'+(tot[i]===max && state.history.length?' class="lead"':'')+'><td><span class="pdot" style="background:'+pcol(i)+'"></span>'+esc(p)+'</td>';
      state.history.forEach(function(r,k){ var v = r[i]; h += '<td class="rs">'+((histEdit && histEdit.p===i && histEdit.r===k) ? '<input class="hin tin" type="number" inputmode="numeric" data-hp="'+i+'" data-hr="'+k+'" value="'+(v==null?'':v)+'">' : '<button type="button" class="tv" data-hp="'+i+'" data-hr="'+k+'">'+(v==null?'–':v)+'</button>')+'</td>'; });
      h += '<td class="total">'+tot[i]+'</td></tr>';
    });
    return h + '</tbody></table></div></div>';
  }
  function renderRecap(){
    var done = state.history.length;
    if(state.peek){
      app.innerHTML = '<div class="topbar"><div class="round">'+tr('scoreboard')+'</div></div>' + scoreboardHtml()
        + '<button type="button" class="primary" data-a="back">'+tr('backTo',state.round)+'</button>';
      return;
    }
    var h = '<div class="topbar"><div class="round">'+tr('roundDone',done)+'</div></div>' + endBanner() + scoreboardHtml();
    h += (state.winner != null ? '<button type="button" class="primary" data-a="replay">'+tr('replay')+'</button>' : '<button type="button" class="primary" data-a="next">'+tr('next')+'</button>')
      + '<div class="row-actions"><button type="button" class="ghost" data-a="undo">'+tr('fix')+'</button>'
      + '<button type="button" class="ghost" data-a="reset">'+tr('newGame')+'</button></div>';
    app.innerHTML = h;
  }

  /* ---------- Événements ---------- */
  app.addEventListener('keydown',function(e){
    var pe = e.target.closest && e.target.closest('.pedit');
    if(e.key==='Enter' && pe){ var ok = pe.querySelector('[data-a="mok"]'); if(ok) ok.click(); }
  });
  app.addEventListener('scroll',function(e){
    var el = e.target;
    if(!el.classList || !el.classList.contains('phist') || syncing) return;
    histScroll = el.scrollLeft; syncing = true;
    var els = app.querySelectorAll('.phist');
    for(var k=0;k<els.length;k++) if(els[k]!==el) els[k].scrollLeft = histScroll;
    syncing = false;
  }, true);
  app.addEventListener('focusout',function(e){
    var el = e.target;
    if(!el.classList || !el.classList.contains('hin')) return;
    var p = +el.dataset.hp, r = +el.dataset.hr, v = parseInt(el.value,10);
    if(!isNaN(v) && state.history[r]) state.history[r][p] = v;
    histEdit = null; if(state.phase!=='round'){ checkEnd(); syncRecord(); } save(); if(state.phase==='round') refreshCard(p); else render();
  });
  app.addEventListener('keydown',function(e){
    if(e.key==='Enter' && e.target.classList && e.target.classList.contains('hin')) e.target.blur();
  });
  app.addEventListener('keydown',function(e){
    if(e.key==='Enter' && e.target.classList && e.target.classList.contains('qin')){
      e.preventDefault();
      var all = Array.prototype.slice.call(app.querySelectorAll('.qin')), k = all.indexOf(e.target);
      if(k >= 0 && k < all.length - 1){ all[k+1].focus(); all[k+1].select(); } else e.target.blur();
    }
  });
  app.addEventListener('keydown',function(e){
    if(e.key==='Enter' && e.target.classList && e.target.classList.contains('addname')){ var ok = app.querySelector('[data-a="addok"]'); if(ok) ok.click(); }
  });
  document.addEventListener('keydown',function(e){
    if(e.key !== 'Enter' || e.defaultPrevented) return;
    var tg = e.target, tn = tg && tg.tagName;
    if(tn === 'INPUT' || tn === 'TEXTAREA' || tn === 'BUTTON' || tn === 'SELECT') return;
    var btn = state.phase === 'round' ? app.querySelector('[data-a="validate"]') : state.phase === 'recap' ? app.querySelector('[data-a="next"]') : null;
    if(btn){ e.preventDefault(); btn.click(); }
  });
  var lpTimer = null;
  app.addEventListener('pointerdown', function(e){
    var pn = e.target.closest && e.target.closest('.pname');
    if(!pn || state.phase !== 'round') return;
    var sec = pn.closest('section[data-p]'); if(!sec) return;
    var pi = +sec.dataset.p;
    if(state.out && state.out[pi]) return;
    clearTimeout(lpTimer);
    lpTimer = setTimeout(function(){
      state.out = state.out || []; state.out[pi] = true;
      if(navigator.vibrate){ try{ navigator.vibrate(40); }catch(err){} }
      save(); refreshCard(pi); updateChips();
    }, 700);
  });
  ['pointerup','pointercancel'].forEach(function(t){ app.addEventListener(t, function(){ clearTimeout(lpTimer); }); });
  window.addEventListener('scroll', function(){ clearTimeout(lpTimer); }, true);
  app.addEventListener('input',function(e){
    var q = e.target;
    if(q.classList && q.classList.contains('qin')){
      var qi = +q.dataset.q, qs = state.sel[qi], qv = parseInt(q.value, 10);
      qs.manual = isNaN(qv) ? null : qv; qs.bust = false;
      if(!isNaN(qv)){ qs.nums = []; qs.negs = []; qs.half = false; qs.lucky = false; qs.zero = false; }
      save(); updateChips();
      var qsec = q.closest('section'), pt = qsec && qsec.querySelector('.ptotal');
      if(pt) pt.textContent = tr('totalC', totals()[qi] + score(qs));
      return;
    }
    var el = e.target;
    if(el.dataset && el.dataset.name !== undefined){
      state.names[+el.dataset.name] = el.value;
      save();
    }
  });
  app.addEventListener('click',function(e){
    var ps = e.target.closest('.pscore[data-score]');
    if(ps && state.phase==='round'){
      editIdx = +ps.dataset.score; refreshCard(editIdx);
      var inp = app.querySelector('.pedit input'); if(inp){ inp.focus(); inp.select(); }
      return;
    }
    var b = e.target.closest('button');
    if(!b) return;
    var d = b.dataset;

    if(d.p !== undefined && state.phase==='round'){
      var i = +d.p, s = state.sel[i];
      if(d.b !== undefined){
        s.bust = !s.bust;
        if(s.bust){ s.nums = []; s.negs = []; s.half = false; s.lucky = false; s.zero = false; s.manual = null; }
        save(); refreshCard(i); return;
      }
      if(d.c !== undefined){
        state.cardsFor = state.cardsFor || [];
        state.cardsFor[i] = !state.cardsFor[i];
        if(state.cardsFor[i]) s.manual = null;
        save(); refreshCard(i);
        return;
      }
      if(d.m !== undefined){
        state.mini = state.mini || [];
        state.mini[i] = !state.mini[i];
        if(state.mini[i]) editIdx = i;
        save(); refreshCard(i);
        return;
      }
      if(d.o !== undefined){
        if(!state.out) state.out = [];
        state.out[i] = !state.out[i];
        save(); refreshCard(i);
        return;
      }
      if(d.n !== undefined) toggle(s.nums, +d.n);
      else if(d.g !== undefined) toggle(s.negs, +d.g);
      else if(d.h !== undefined) s.half = !s.half;
      else if(d.l !== undefined) s.lucky = !s.lucky;
      else if(d.z !== undefined) s.zero = !s.zero;
      if(d.n !== undefined || d.g !== undefined || d.h !== undefined || d.l !== undefined || d.z !== undefined){ s.manual = null; s.bust = false; }
      save(); refreshCard(i);
      return;
    }
    if(d.hr !== undefined && d.hp !== undefined){
      histEdit = { p: +d.hp, r: +d.hr }; if(state.phase==='round') refreshCard(+d.hp); else render();
      var hi = app.querySelector('.hin'); if(hi){ hi.focus(); hi.select(); }
      return;
    }
    if(d.t !== undefined && state.phase === 'setup'){ state.target = +d.t; save(); render(); return; }
    if(d.lang){ state.lang = d.lang; save(); render(); return; }
    switch(d.a){
      case 'minus': if(state.count>2){ state.count--; save(); renderSetup(); } break;
      case 'plus': if(state.count<12){ state.count++; save(); renderSetup(); } break;
      case 'start':
        state.players = [];
        for(var k=0;k<state.count;k++) state.players.push((state.names[k]||'').trim() || tr('playerN',k+1));
        state.round = 1; state.history = []; state.winner = null; state.tie = false; state.meta = []; state.gameId = Date.now();
        state.out = state.players.map(function(){ return false; });
        state.sel = state.players.map(emptySel);
        state.phase = 'round'; save(); render(); window.scrollTo(0,0);
        break;
      case 'mok':
        var mk = +d.i, mv = parseInt(b.closest('.pedit').querySelector('input').value, 10);
        if(!isNaN(mv)){ var ms = state.sel[mk]; ms.nums = []; ms.negs = []; ms.half = false; ms.lucky = false; ms.zero = false; }
        state.sel[mk].manual = isNaN(mv) ? null : mv; state.sel[mk].bust = false; editIdx = null; save(); refreshCard(mk);
        break;
      case 'mauto':
        var ak = +d.i; state.sel[ak].manual = null; editIdx = null; save(); refreshCard(ak);
        break;
      case 'validate':
        editIdx = null; histEdit = null;
        var active = state.players.filter(function(p,i){ return !(state.out && state.out[i]); }).length;
        if(active < 1){ flash(b,tr('needOne')); break; }
        state.history.push(state.sel.map(function(s,i){ return (state.out && state.out[i]) ? null : score(s); }));
        state.meta = state.meta || [];
        while(state.meta.length < state.history.length - 1) state.meta.push([]);
        state.meta.push(state.sel.map(function(s,i){ return (state.out && state.out[i]) ? null : { f7: !s.bust && s.manual == null && isFlip7(s), bust: !!s.bust }; }));
        checkEnd(); celebrate = state.winner != null; syncRecord();
        state.last = state.sel;
        state.phase = 'recap'; save(); render(); window.scrollTo(0,0);
        break;
      case 'abandon':
        if(confirmNow(b,'abandon',tr('confAbandon'))){
          state.winner = null; state.tie = false; state.phase = 'setup'; state.players = []; state.history = []; state.sel = []; state.out = []; state.round = 1; state.last = null; state.peek = false;
          save(); render(); window.scrollTo(0,0);
        }
        break;
      case 'quick':
        state.quick = !state.quick; state.cardsFor = []; editIdx = null; save(); render();
        break;
      case 'replay':
        state.history = []; state.meta = []; state.sel = state.players.map(emptySel); state.gameId = Date.now();
        state.out = state.players.map(function(){ return false; }); state.mini = []; state.cardsFor = [];
        state.round = 1; state.winner = null; state.tie = false; state.last = null; state.peek = false;
        state.phase = 'round'; save(); render(); window.scrollTo(0,0);
        break;
      case 'hof':
        showHof = !showHof; render();
        break;
      case 'hofclear':
        if(confirmNow(b,'hofclear',tr('confReset'))){ saveGames([]); render(); }
        break;
      case 'allbust':
        var actIdx = state.players.map(function(p,i){ return i; }).filter(function(i){ return !(state.out && state.out[i]); });
        var allOn = actIdx.every(function(i){ return state.sel[i] && state.sel[i].bust; });
        actIdx.forEach(function(i){ var ss = state.sel[i]; ss.bust = !allOn; if(!allOn){ ss.nums = []; ss.negs = []; ss.half = false; ss.lucky = false; ss.zero = false; ss.manual = null; } });
        editIdx = null; save(); render();
        break;
      case 'addp':
        addMode = !addMode; render();
        if(addMode){ var an = app.querySelector('.addname'); if(an) an.focus(); }
        break;
      case 'addcancel':
        addMode = false; render();
        break;
      case 'addok':
        var nv = (app.querySelector('.addname') || {}).value || '';
        var nn = nv.trim() || tr('playerN', state.players.length + 1);
        state.players.push(nn);
        state.sel.push(emptySel());
        state.history.forEach(function(r){ r.push(null); });
        (state.meta || []).forEach(function(r){ r.push(null); });
        if(state.out) state.out.push(false);
        if(state.mini) state.mini.push(false);
        state.names = state.names || []; state.names[state.players.length - 1] = nn;
        state.count = state.players.length;
        addMode = false; save(); render();
        break;
      case 'back': state.peek = false; state.phase = 'round'; save(); render(); break;
      case 'next':
        state.round = state.history.length + 1;
        state.sel = state.players.map(emptySel);
        state.last = null;
        state.phase = 'round'; save(); render(); window.scrollTo(0,0);
        break;
      case 'undo':
        state.winner = null; state.tie = false; syncRecord();
        if(state.meta) state.meta.length = Math.max(0, Math.min(state.meta.length, state.history.length - 1));
        if(state.history.length){
          state.history.pop();
          state.round = state.history.length + 1;
          state.sel = state.last || state.players.map(emptySel);
          while(state.sel.length < state.players.length) state.sel.push(emptySel());
          state.phase = 'round'; save(); render(); window.scrollTo(0,0);
        }
        break;
      case 'scoreboard':
        if(state.history.length){ state.phase = 'recap'; state.peek = true; save(); render(); }
        else { flash(b,tr('noRound')); }
        break;
      case 'reset':
        if(confirmNow(b,'reset',tr('confReset'))){ var keepLang = state.lang; state = fresh(); state.lang = keepLang; save(); render(); }
        break;
    }
  });

  render();
})();
</script>
</body>
</html>
